<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 · 智慧图书馆管理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="auth-page">
    <section class="auth-brand">
        <div class="brand-logo">
            <span class="logo-mark">📚</span>
            <span>LibraryWeb2026</span>
        </div>
        <h1 class="brand-title">加入智慧图书馆</h1>
        <p class="brand-desc">注册后即可根据角色使用对应功能。系统会校验同名账号与手机号，确保账号唯一。</p>
        <div class="brand-points">
            <div><span class="dot">1</span> 填写姓名、密码与手机号</div>
            <div><span class="dot">2</span> 选择专业与角色</div>
            <div><span class="dot">3</span> 根据角色补充对应信息</div>
            <div><span class="dot">4</span> 注册成功后返回登录</div>
        </div>
    </section>

    <section class="auth-form-side">
        <div class="auth-card">
            <h2>创建账号</h2>
            <p class="subtitle">请完整填写以下信息完成注册</p>

            <div v-if="error" class="alert alert-error">{{ error }}</div>

            <form id="registerForm" @submit.prevent="submit">
                <div class="field">
                    <label>姓名 / 用户名 <span class="req">*</span></label>
                    <input class="input" type="text" v-model.trim="form.name" placeholder="请输入姓名（用于登录）">
                </div>

                <div class="field">
                    <label>密码 <span class="req">*</span></label>
                    <input class="input" type="password" v-model="form.password" placeholder="至少 3 位">
                </div>

                <div class="field">
                    <label>确认密码 <span class="req">*</span></label>
                    <input class="input" type="password" v-model="form.confirm" placeholder="请再次输入密码">
                </div>

                <div class="field">
                    <label>手机号 <span class="req">*</span></label>
                    <input class="input" type="text" v-model.trim="form.phone" maxlength="11"
                           placeholder="请输入 11 位手机号">
                </div>

                <div class="field">
                    <label>专业 <span class="req">*</span></label>
                    <select class="select" v-model="form.major">
                        <option value="">请选择专业</option>
                        <option v-for="m in majors" :key="m" :value="m">{{ m }}</option>
                    </select>
                    <input v-if="form.major === '其他专业'" class="input" style="margin-top:10px"
                           v-model.trim="form.customMajor" placeholder="请输入你的专业">
                </div>

                <div class="field">
                    <label>角色 <span class="req">*</span></label>
                    <select class="select" v-model="form.role">
                        <option value="">请选择角色</option>
                        <option value="学生">学生</option>
                        <option value="教师">教师</option>
                        <option value="操作员">操作员</option>
                        <option value="管理员">管理员</option>
                    </select>
                </div>

                <div v-if="form.role === '管理员'" class="field">
                    <label>权限等级</label>
                    <input class="input" type="number" min="1" v-model.number="form.permissionLevel" placeholder="如 1">
                    <label style="margin-top:12px">入职时间</label>
                    <input class="input" type="date" v-model="form.entryTime">
                </div>

                <div v-if="form.role === '操作员'" class="field">
                    <label>负责区域</label>
                    <input class="input" type="text" v-model.trim="form.area" placeholder="如 图书馆一楼">
                    <label style="margin-top:12px">职务</label>
                    <input class="input" type="text" v-model.trim="form.duty" placeholder="如 图书管理员">
                </div>

                <div v-if="form.role === '学生'" class="field">
                    <label>年级</label>
                    <input class="input" type="text" v-model.trim="form.grade" placeholder="如 2022级">
                    <label style="margin-top:12px">所属学院</label>
                    <input class="input" type="text" v-model.trim="form.college" placeholder="如 计算机学院">
                </div>

                <div v-if="form.role === '教师'" class="field">
                    <label>所属学院</label>
                    <input class="input" type="text" v-model.trim="form.college" placeholder="如 计算机学院">
                    <label style="margin-top:12px">职称</label>
                    <input class="input" type="text" v-model.trim="form.title" placeholder="如 教授">
                </div>

                <div class="auth-actions">
                    <button type="submit" class="btn btn-block" :disabled="loading">
                        {{ loading ? '注册中...' : '注册' }}
                    </button>
                    <a class="btn btn-ghost" href="login.html" style="flex:1">返回登录</a>
                </div>
            </form>
        </div>
    </section>
</div>

<script src="lib/jquery.min.js"></script>
<script src="js/common.js"></script>
<script src="lib/axios.min.js"></script>
<script src="js/api.js"></script>
<script src="lib/vue.global.prod.js"></script>
<script>
    const { createApp } = Vue;
    createApp({
        data() {
            return {
                majors: ['计算机科学与技术', '软件工程', '人工智能', '数据科学', '信息管理',
                    '图书馆学', '车辆工程', '土木工程', '经济学', '汉语言文学', '其他专业'],
                form: {
                    name: '', password: '', confirm: '', phone: '', major: '', customMajor: '', role: '',
                    permissionLevel: 1, entryTime: '', area: '', duty: '', grade: '', college: '', title: ''
                },
                error: '',
                loading: false
            };
        },
        methods: {
            async submit() {
                this.error = '';
                const f = this.form;
                const major = f.major === '其他专业' ? f.customMajor : f.major;
                if (!f.name) return this.fail('请输入姓名');
                if (!f.password || f.password.length < 3) return this.fail('密码至少 3 位');
                if (f.password !== f.confirm) return this.fail('两次输入的密码不一致');
                if (!/^1[3-9]\d{9}$/.test(f.phone)) return this.fail('请输入正确的 11 位手机号');
                if (!major) return this.fail('请选择或填写专业');
                if (!f.role) return this.fail('请选择角色');

                const payload = {
                    name: f.name,
                    password: f.password,
                    phone: f.phone,
                    major: major,
                    role: f.role,
                    permissionLevel: f.role === '管理员' ? (f.permissionLevel || 1) : null,
                    entryTime: f.role === '管理员' && f.entryTime ? f.entryTime : null,
                    area: f.role === '操作员' ? f.area : null,
                    duty: f.role === '操作员' ? f.duty : null,
                    grade: f.role === '学生' ? f.grade : null,
                    college: (f.role === '学生' || f.role === '教师') ? f.college : null,
                    title: f.role === '教师' ? f.title : null
                };
                this.loading = true;
                try {
                    const res = await api.post('/register', payload);
                    if (res.code === 200) {
                        showToast('注册成功，正在返回登录...', 'success');
                        setTimeout(() => { location.href = 'login.html'; }, 900);
                    } else {
                        this.fail(res.message || '注册失败');
                    }
                } catch (e) {
                    this.fail('注册失败，请稍后重试');
                } finally {
                    this.loading = false;
                }
            },
            fail(message) {
                this.error = message;
                shake('#registerForm');
            }
        }
    }).mount('#app');
</script>
</body>
</html>
